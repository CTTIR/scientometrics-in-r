bookdown::bs4_book:
  theme:
    primary: "#1565c0"
    bg: "#fafafa"
    fg: "#212121"
    base_font: { google: "Inter" }
    heading_font: { google: "Inter" }
    code_font: { google: "JetBrains Mono" }
  repo:
    base: https://github.com/CTTIR/scientometrics-in-r
    branch: main
  css: [style/style.css, style/font-awesome.min.css]
  includes:
    in_header: style/header.html
    after_body: style/after-body.html
  split_by: chapter
  config:
    toc:
      collapse: section
      scroll_highlight: yes
    download: null
bookdown::pdf_book:
  latex_engine: xelatex
  citation_package: natbib
  keep_tex: true
  toc_depth: 3
  includes:
    in_header: style/preamble.tex
  pandoc_args: ["--top-level-division=chapter", "--lua-filter=scripts/pdf-table-code.lua"]
bookdown::epub_book:
  cover_image: "images/cover-corrected.png"
  stylesheet: style/style.css
  toc_depth: 3
