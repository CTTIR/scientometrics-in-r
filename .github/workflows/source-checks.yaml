name: Source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RENV_CONFIG_AUTOLOADER_ENABLED: 'false'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      # The separate provider test needs live credentials; fixtures mock requests.
      NOT_CRAN: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install PDF fixture reader
        run: python -m pip install pypdf==6.21.4
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          r-version: '4.6.1'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          dependencies: 'c("Depends", "Imports", "LinkingTo")'
          install-pandoc: 'false'
          install-quarto: 'false'
          packages: |
            any::testthat
            any::bursts
            any::dplyr
            any::ggplot2
            any::igraph
            any::openalexR
            any::rlang
            any::stopwords
            any::tibble
            any::tidyr
            any::viridis
            any::knitr
            any::gt
            any::systemfonts
            any::rmarkdown
            any::yaml
            any::xml2
            any::zip
      - name: Install fonts for format-isolation tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-dejavu-mono
      - name: Check source provenance and download fixtures
        run: python -m unittest discover -s tests
      - name: Test helper functions with mocked provider fixtures
        run: Rscript --vanilla -e 'testthat::test_dir("tests/testthat")'
      - name: Check format isolation, EPUB packaging and cached setup
        run: |
          Rscript --vanilla scripts/verify-render-formats.R
          Rscript --vanilla scripts/test-epub-packaging.R
          Rscript --vanilla tests/test_setup_cache.R
