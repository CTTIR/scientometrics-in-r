name: Render and deploy book

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Publish the validated book to GitHub Pages"
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "0 2 * * 0"

permissions:
  contents: write

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      SCIENTOMETRICS_REBUILD_CHUNKS: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Disable renv autoloader in CI
        run: rm -f .Rprofile

      - name: Verify the executable book credential is configured
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          if [ -z "$OPENALEX_API_KEY" ]; then
            echo "::error::Configure the OPENALEX_API_KEY repository secret before rendering the executable book."
            exit 1
          fi

      - name: Install system dependencies
        timeout-minutes: 30
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libxml2-dev libgit2-dev \
            libfontconfig1-dev libharfbuzz-dev libfribidi-dev \
            libpoppler-cpp-dev libtesseract-dev libleptonica-dev \
            libudunits2-dev libgdal-dev libmagick++-dev default-jdk \
            libglpk-dev libnode-dev libv8-dev cmake libgsl-dev libjq-dev \
            fonts-noto-cjk fonts-dejavu-core fonts-dejavu-mono

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"
          use-public-rspm: true

      - name: Cache R library
        uses: actions/cache@v4
        with:
          path: /home/runner/work/_temp/Library
          key: rlib-Linux-r4.6.1-book-${{ hashFiles('scripts/install-book-deps.R', 'DESCRIPTION') }}
          restore-keys: |
            rlib-Linux-r4.6.1-book-

      - name: Install executable book dependencies
        # The reader-facing installer is also the CI inventory. This uses
        # current repository packages; it does not restore historical renv.lock.
        run: |
          Rscript --vanilla scripts/install-book-deps.R \
            --repos=https://packagemanager.posit.co/cran/__linux__/noble/latest

      - uses: r-lib/actions/setup-tinytex@v2

      - name: Check PDF, HTML and EPUB format isolation
        run: Rscript --vanilla scripts/verify-render-formats.R

      - name: Check EPUB packaging and failure handling
        run: Rscript --vanilla scripts/test-epub-packaging.R

      - name: Render book (HTML + PDF + EPUB)
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: Rscript -e 'bookdown::render_book("index.Rmd", output_format = "all")'

      - name: Package and verify EPUB
        run: Rscript --vanilla scripts/repair-epub.R docs/scientometrics-in-r.epub

      - name: Validate EPUB conformance
        run: |
          epubcheck_dir="$RUNNER_TEMP/scientometrics-epubcheck"
          mkdir -p "$epubcheck_dir"
          curl --fail --location --retry 3 \
            https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip \
            --output "$epubcheck_dir/epubcheck.zip"
          printf '%s  %s\n' \
            '33350c61038e71dfb3d45a76aed04bf5481e6d5500cb780f6e98db8bbd15a28c' \
            "$epubcheck_dir/epubcheck.zip" | sha256sum --check -
          unzip -q "$epubcheck_dir/epubcheck.zip" -d "$epubcheck_dir"
          java -jar "$epubcheck_dir/epubcheck-5.4.0/epubcheck.jar" \
            --failonwarnings docs/scientometrics-in-r.epub

      - name: Render per-chapter PDFs
        # Nice-to-have; the full book PDF/EPUB/HTML are already built.
        # Don't block deploy on a single chapter's LaTeX hiccup.
        continue-on-error: true
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: Rscript scripts/render-chapter-pdfs.R

      - name: Inventory available downloads
        run: Rscript scripts/build-download-manifest.R

      - name: Upload manual build for review
        if: success() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: scientometrics-book-${{ github.run_id }}
          path: docs/
          retention-days: 7
          if-no-files-found: error

      - name: Deploy to gh-pages
        if: >-
          github.event_name != 'pull_request' &&
          (github.event_name != 'workflow_dispatch' || inputs.deploy == true)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs
