# Build the companion package's pkgdown site and publish it under /pkg on
# GitHub Pages. R CMD check runs in R-CMD-check.yaml.
name: pkgdown

on:
  push:
    branches: [main]
    paths:
      - "R/**"
      - "man/**"
      - "DESCRIPTION"
      - "NAMESPACE"
      - "NEWS.md"
      - ".github/workflows/pkgdown.yaml"
  pull_request:
    branches: [main]
    paths:
      - "R/**"
      - "man/**"
      - "DESCRIPTION"
      - "NAMESPACE"
      - "NEWS.md"
      - ".github/workflows/pkgdown.yaml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Publish the package site to GitHub Pages"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Disable renv autoloader in CI
        run: rm -f .Rprofile

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build pkgdown site
        run: |
          pkgdown::build_site(override = list(destination = "_book/pkg"))
        shell: Rscript {0}

      - name: Deploy pkgdown to GitHub Pages
        if: >-
          github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
          (github.event_name != 'workflow_dispatch' || inputs.deploy == true)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_book/pkg
          destination_dir: pkg
          keep_files: true
