<!-- Dark/light mode toggle -->
<div class="sticky-item">
  <button type="button" id="mode-switch" class="btn-circle-mode" aria-label="Toggle dark mode">
    <i class="fa-solid fa-circle-half-stroke" aria-hidden="true"></i>
  </button>
</div>

<script>
  (function () {
    var stored = localStorage.getItem('themeMode');
    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var initial = stored || (prefersDark ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', initial);

    document.addEventListener('DOMContentLoaded', function () {
      var btn = document.getElementById('mode-switch');
      if (!btn) return;
      btn.addEventListener('click', function () {
        var current = document.documentElement.getAttribute('data-theme');
        var next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('themeMode', next);
      });
    });
  })();
</script>

<!-- Links are limited to nonempty artifacts inventoried after rendering. -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    var extraList = document.querySelector(".book-extra ul.list-unstyled");
    if (!extraList) return;

    var src = document.getElementById("book-source");
    var sourcePath = null;
    if (src && src.href) {
      var match = src.href.match(/blob\/[^/]+\/(.+\.Rmd)$/);
      if (match) sourcePath = decodeURIComponent(match[1]);
    }

    fetch("downloads.json", { cache: "no-cache" })
      .then(function (response) {
        return response.ok ? response.json() : null;
      })
      .then(function (inventory) {
        if (!inventory) return;
        var book = inventory.book || {};
        var chapters = inventory.chapters || {};
        var links = [];
        if (book.pdf) links.push(["book-pdf-full", book.pdf, "Entire book (PDF)"]);
        if (book.epub) links.push(["book-epub-full", book.epub, "Entire book (EPUB)"]);
        if (sourcePath && chapters[sourcePath]) {
          links.push(["book-pdf-chapter", chapters[sourcePath], "This chapter (PDF)"]);
        }
        if (!links.length) return;

        var firstChild = extraList.firstElementChild;
        var header = document.createElement("li");
        header.className = "book-extra-section";
        var heading = document.createElement("strong");
        heading.textContent = "Download";
        header.appendChild(heading);
        extraList.insertBefore(header, firstChild);
        links.forEach(function (link) {
          var item = document.createElement("li");
          var anchor = document.createElement("a");
          anchor.id = link[0];
          anchor.href = link[1];
          anchor.textContent = link[2];
          item.appendChild(anchor);
          extraList.insertBefore(item, firstChild);
        });
      })
      .catch(function () {
        // A missing or unreadable inventory offers no unverified downloads.
      });
  });
</script>
